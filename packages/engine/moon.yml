# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: 'library'
language: 'bash'

# The interpreter (docs/INTERPRETER.md §9): this project's justfile builds
# `build/lib/libjsrt_interp.a`, which the compiler links only into programs that interpret.
tasks:
  build:
    script: 'just interp'
    toolchain: 'system'
    inputs:
      - 'src/**/*'
      - 'build.zig'
      - 'build.zig.zon'
      - 'justfile'
    outputs:
      - 'build/lib/libjsrt_interp.a'
