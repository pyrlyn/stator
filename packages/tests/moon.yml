# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: 'application'
language: 'typescript'

# The test harnesses spawn the compiler CLI and link the built runtime archive (and, for a program
# that imports `std/*`, the std archive), so linking tasks depend on `runtime:build` and
# `std:build`. Commands mirror package.json's scripts (see compiler/moon.yml for
# why moon calls tools directly rather than through pnpm). All tasks run from the workspace root.
dependsOn:
  - 'compiler'
  - 'node'
  - 'runtime'
  - 'std'

tasks:
  typecheck:
    script: './node_modules/.bin/tsc --noEmit -p packages/tests/tsconfig.json'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
  unit:
    script: './node_modules/.bin/vitest run --config packages/tests/vitest.config.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    # Unit tests link native binaries against the runtime archive (helpers.ts
    # compileAndRunStreams), so without this edge moon may race the test run
    # against a concurrent archive rebuild. `pnpm run ci` is serial and never hit it.
    deps:
      - 'runtime:build'
      - 'std:build'
  coverage:
    script: './node_modules/.bin/c8 ./node_modules/.bin/vitest run --config packages/tests/vitest.config.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    # Same unit files as `unit`, including the NATIVE_ONLY proofs that link
    # `runtime/build/libjsrt.a` — without this edge moon may race the coverage
    # run against a concurrent archive rebuild (moon parity audit, plan-notes 269).
    deps:
      - 'runtime:build'
      - 'std:build'
  subset:
    script: 'node packages/tests/subset/run.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    # No deps on purpose: the subset runner only runs in-process `explain` (no
    # archive, no link) and CI runs it before the runtime build, so an edge here
    # would only serialize local iteration (moon parity audit, plan-notes 269).
  golden:
    script: 'node packages/tests/golden/run.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    deps:
      - 'runtime:build'
      - 'std:build'
  selfhost:
    script: 'node packages/tests/selfhost/run.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    # The std smoke check builds and runs binaries (plan.md §9 Task 6.19).
    deps:
      - 'runtime:build'
      - 'std:build'
  builtins:
    script: 'node packages/tests/golden/builtins.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    deps:
      - 'runtime:build'
      - 'std:build'
  node-coverage:
    script: 'node packages/tests/golden/node-coverage.ts --check'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
  runtime-corpus:
    script: 'just -f packages/runtime/justfile -d packages/runtime runtime-test'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    deps:
      - 'runtime:build'
  leak:
    script: 'node packages/tests/leak/run.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    deps:
      - 'runtime:build'
      - 'std:build'
  ffi:
    script: 'node packages/tests/ffi/run.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true
    deps:
      - 'runtime:build'
      - 'std:build'
  asan:
    script: 'node packages/tests/golden/asan-gate.ts'
    toolchain: 'system'
    options:
      runFromWorkspaceRoot: true

  # `moon run tests:ci` runs the whole graph (with caching); the command itself is a no-op and the
  # work happens in the dependencies. `pnpm run ci` remains the serial human/CI entry point.
  ci:
    command: 'noop'
    deps:
      - 'compiler:typecheck'
      - 'compiler:lint'
      - 'compiler:dupes'
      - 'compiler:js-sources'
      - 'tests:typecheck'
      - 'std:typecheck'
      - 'node:typecheck'
      - 'vite-stator:typecheck'
      - 'runtime:build'
      - 'std:build'
      - 'tests:unit'
      - 'tests:runtime-corpus'
      - 'tests:subset'
      - 'tests:golden'
      - 'tests:selfhost'
      - 'tests:builtins'
      - 'tests:node-coverage'
      - 'tests:leak'
      - 'tests:asan'
      - 'tests:ffi'
