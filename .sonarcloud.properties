# Read by SonarCloud's Automatic Analysis, which ignores sonar-project.properties.
# stator-ts's test fixtures are inputs the checker must diagnose: unused expressions,
# floating promises and near-identical cases are the point, not defects.
# The eval golden fixtures and the Test262 host exist to run code through eval: the host reads
# the script exec.zig wrote and hands it to the interpreter, and nothing else ever reaches it.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,coverage/**,packages/transpiler/tests/**,packages/engine/test262/host.ts,packages/tests/golden/js/eval_*.js,packages/tests/golden/js/eval_*/**
sonar.cpd.exclusions=packages/transpiler/tests/**
