# Read by SonarCloud's Automatic Analysis, which ignores sonar-project.properties.
# stator-ts's test fixtures are inputs the checker must diagnose: unused expressions,
# floating promises and near-identical cases are the point, not defects.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,coverage/**,packages/transpiler/tests/**
sonar.cpd.exclusions=packages/transpiler/tests/**
