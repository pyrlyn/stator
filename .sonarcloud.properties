# SonarCloud Automatic Analysis (project pyrlyn_stator) reads this file, not
# sonar-project.properties, which only the CI scanner uses.
# Test inputs are excluded: golden, subset and checker fixtures are deliberately unusual code
# (bare expressions, global NaN/isFinite, vendored upstream modules) that must stay as written.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,coverage/**,packages/tests/**,packages/transpiler/tests/**
