# jactionlint configuration: https://github.com/jdx/jactionlint/blob/main/docs/config.md
# The default profile applies. `baseline: auto` hides the findings recorded in
# .github/jactionlint-baseline.json; refresh it with `mise x -- jactionlint --baseline-write`.
baseline: auto

# pyrlyn-archive/ci-old's no-pinned-ci job fails a pull request that pins these callers to a
# commit. @main is the reference on purpose (plan-notes 361, 362).
ignores:
  - rule: unpinned-uses
    uses: pyrlyn-archive/ci-old/.github/workflows/ci.yml@main
    file: .github/workflows/pipeline.yml
    reason: pyrlyn-archive/ci-old no-pinned-ci rejects a SHA pin; @main is required
  - rule: unpinned-uses
    uses: pyrlyn-archive/ci-old/.github/workflows/sync-docs.yml@main
    file: .github/workflows/sync-docs.yml
    reason: pyrlyn-archive/ci-old no-pinned-ci rejects a SHA pin; @main is required
  - rule: unpinned-uses
    uses: pyrlyn-archive/ci-old/.github/actions/macos-runner@main
    file: .github/workflows/ci.yml
    reason: pyrlyn-archive/ci-old no-pinned-ci rejects a SHA pin; @main is required
