name: Stator Node and pnpm setup
description: Install the repository-pinned pnpm, Node and (Unix) Zig toolchain
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
        cache: pnpm
    # The runtime's memory core is Zig (plan-notes 238, T9.1), and so is
    # stator-ts, which `pnpm run typecheck` builds on every platform, Windows
    # included (plan/T65). Version matches the mise pin in mise.toml.
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.17.1
