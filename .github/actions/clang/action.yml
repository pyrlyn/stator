name: Stator pinned clang
description: Install the clang and LLVM mise.toml pins and put that clang first on PATH (plan/T35, plan-notes 410)
runs:
  using: composite
  steps:
    # The tools are named without versions, so mise.toml stays the one place they are pinned; the
    # action caches the install per OS, arch and mise.toml. No shims and no `mise env` export:
    # mise.toml also pins Node, pnpm and Zig, which `setup` installs its own way.
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        install_args: conda:clang conda:llvm
        add_shims_to_path: false
        env: false
        export_path: false
    # statorc's default asks `mise which` itself; the justfiles' default is the `clang` on PATH.
    # Putting mise's clang first there makes the two the same compiler.
    - name: Put mise's clang first on PATH
      shell: bash
      run: |
        set -euo pipefail
        mise bin-paths conda:clang >> "$GITHUB_PATH"
        mise which clang --tool conda:clang
    # The pinned clang links against its own sysroot; LIBRARY_PATH is searched after it, so a
    # distro library (-lsqlite3) is found while libc still comes from the sysroot (plan-notes 410).
    - name: Let it link distro libraries
      if: runner.os == 'Linux'
      shell: bash
      run: echo "LIBRARY_PATH=/usr/lib/$(uname -m)-linux-gnu" >> "$GITHUB_ENV"
