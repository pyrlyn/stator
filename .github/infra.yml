# Configuration for pyrlyn/ci's ci.yml, called from pipeline.yml (docs/config.md in
# pyrlyn/ci). Replaces the former pipeline.yml call and sonarcloud.yml; language CI stays in ci.yml.
version: 1

codeql:
  # TypeScript/JavaScript and the C runtime.
  languages: [actions, c-cpp, javascript-typescript]

snyk:
  enabled: true

# SonarCloud is `pipeline / sonarcloud` inside pyrlyn/ci's ci.yml, which pipeline.yml
# calls as `@main`. A local sonarcloud.yml pinned by SHA fails `no-pinned-ci` (plan-notes
# 361). sonar-project.properties holds the project key. mise installs only the tools the
# runtime build needs (`pnpm`, not `npm:pnpm` — #138). Setup is a hard failure, so a broken
# runtime stops the job before coverage. Coverage and the scan stay soft-fail (the shared
# default). To make the analysis blocking, set `soft-fail: false` here.
sonarcloud:
  enabled: true
  mise-install-args: "node pnpm just zig conda:clang conda:llvm"
  setup-command: "pnpm install --frozen-lockfile && pnpm run runtime"
  coverage-command: "pnpm run test:coverage"
