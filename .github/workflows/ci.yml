name: ci

on:
  # Main pushes run the same jobs as pull requests. The revert job is push-only
  # (`github.event_name == 'push'` below); without this trigger it never fires,
  # and a merge to main would have no test gate of its own.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Dependabot pull requests: dependabot.yml calls this workflow so they get the
  # same jobs before its patch-only auto-merge.
  workflow_call:

# A push that supersedes an in-flight run cancels it: six platforms times five jobs is a lot of
# runner time to spend proving something about a commit nobody is waiting on any more.
concurrency:
  # github.workflow, not a literal: called from dependabot.yml it names the
  # caller, so that run does not cancel (or get cancelled by) this workflow's
  # own pull_request run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pnpm run ci` is ONE SERIAL CHAIN by design -- it is the gate a human runs before claiming a task
# done (AGENTS.md golden rule 1), and serial is what makes its first failure the interesting one.
# CI wants the opposite: every step that does not feed another should run at the same time. So the
# chain is decomposed here, and this map is what says nothing was dropped in the process:
#
#   typecheck   -> static (once) + frontend (every platform)
#   lint        -> static
#   dupes       -> static
#   check-js-sources -> static
#   test        -> frontend
#   test:coverage -> frontend (linux/x64; lcov artifact)
#   runtime     -> runtime
#   test:runtime-> runtime
#   test:subset -> frontend
#   test:golden -> runtime
#   test:selfhost -> runtime
#   test:builtins-> runtime
#   test:leak   -> runtime
#   test:asan   -> asan (STATOR_ASAN_FORCE=1 in CI: always the full pass, never the hash skip)
#   test:ffi    -> ffi
#
# Two stages (owner request): stage 1 is Linux-only and cheap to fail -- `static` (lint, format,
# typecheck, dupes) plus `frontend (linux/x64)` (subset + unit tests WITH coverage, the lcov owner).
# Stage 2 is every Windows and macOS job (`frontend-desktop`, `runtime-macos`, `asan-macos`,
# `intl-macos`, `ffi-macos`); each has `needs: [static, frontend-coverage]`, so nothing starts on a
# macOS/Windows runner until stage 1 is green, and none of them collects coverage. The remaining
# Linux jobs (test262, linux/arm64 frontend, linux runtime/asan/intl/ffi) are not part of either
# stage: they stay ungated and run alongside stage 1, so a slow conformance run never delays
# the desktop platforms and a red desktop run never hides a Linux result.
#
# Plus `test:intl`, which is deliberately NOT part of `pnpm run ci` (the ICU feature build is off by
# default, plan.md Task 4.4) and therefore had no coverage at all until this job existed.
# Same for `test:ffi`: it needs clang and the built archive, so it lives in its own job and in
# `moon run tests:ci`, not in the serial gate — which stays offline-runnable.

# Build and test jobs need only to read the repository; a job that needs more
# (revert-on-failure) declares its own. This also caps these jobs when
# dependabot.yml calls this workflow with wider permissions.
permissions:
  contents: read

jobs:
  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@4b5b5470544893cd515b88c751e92728341c6daa # main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-14"]'

  # Test262 is intentionally separate from pnpm run ci: a missing corpus must not make the local
  # offline gate lie, while this job makes the pinned conformance number visible on every commit.
  # The full pinned corpus is ~54k tests. Pre-speedup wall-clock was 2-3.5h on one runner (plan-notes
  # 198); in-process build + two-phase classify cut that sharply, and eight shards keep headroom
  # under the 2-hour per-job ceiling so the conformance number stays on every commit.
  test262:
    name: test262 conformance (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 120
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &setup
        uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/tests/test262/corpus
          key: test262-${{ hashFiles('packages/tests/test262/pin.json') }}
      - &pnpm-install
        run: pnpm install --frozen-lockfile
      - run: pnpm run test262:fetch
      - name: Run Test262
        # STATOR_TEST_JOBS left unset: pool width defaults to os.availableParallelism() on the runner.
        run: pnpm run test262 -- --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test262-shard-${{ matrix.shard }}
          path: packages/tests/test262/results-${{ matrix.shard }}-of-8.json
          if-no-files-found: error

  # Where the run is actually judged. A shard sees a slice of the corpus, and both gates are
  # statements about the whole of it -- the ratchet compares corpus totals and expected-fail.txt
  # names individual tests -- so `--aggregate` reassembles the shards and applies them once.
  test262-report:
    name: test262 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: test262
    # `needs` alone would skip this job when a shard fails, and a skipped gate reports nothing --
    # the dishonest version of a conformance heartbeat (§9's opening paragraph). Run it whenever the
    # shards ran at all; `--aggregate` fails loudly on a missing shard file.
    if: always() && needs.test262.result != 'cancelled'
    steps:
      - *checkout
      - *setup
      - *pnpm-install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test262-shard-*
          path: shards
      - name: Aggregate and gate
        # `pipefail` is NOT the default for a `run:` step, and without it `tee` decides this job's
        # exit status -- the ratchet could fail and the job would still be green, which is the
        # dishonest version of a conformance heartbeat (§9's opening paragraph).
        shell: bash
        run: |
          set -o pipefail
          pnpm run test262 -- --aggregate shards 2>&1 | tee test262.log
      - name: Publish conformance summary
        if: always()
        run: grep '^test262:' test262.log >> "$GITHUB_STEP_SUMMARY" || true

  # STAGE 1. Host-independent by construction: no native code, no filesystem semantics, no clang.
  # Running these six times would prove the same thing six times.
  static:
    name: static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout
      - *setup
      - *pnpm-install
      # site/ is its own pnpm project (own lockfile); type-aware oxlint resolves its tsconfig's
      # `extends` from site/node_modules, so lint fails without it (plan-notes 349).
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run dupes
      - run: node scripts/check-js-sources.ts
      # Workflow lint, not part of `pnpm run ci`: jactionlint with .github/jactionlint.yaml and its
      # baseline, the check the pre-push hook (hk.pkl) runs. Last, so mise's PATH never shadows the
      # Node above; install_args installs only jactionlint (version as in mise.toml), and
      # shellcheck comes from the runner image.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: github:jdx/jactionlint@2.0.2
      - run: jactionlint --color

  # STAGE 1. The compiler itself on linux/x64, which owns coverage: it builds the runtime archive,
  # so native-only unit tests actually run, and one platform is enough for the lcov artifact.
  # Keeps the check name `frontend (linux/x64)` it had as a matrix entry.
  frontend-coverage:
    name: frontend (linux/x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout
      - &setup-just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - *setup
      - &record-toolchain
        name: Record toolchain
        shell: bash
        run: |
          node --version
          node -p "process.platform + '/' + process.arch"
          uname -srm || true
      - *pnpm-install
      - run: pnpm run typecheck
      - run: pnpm run test:subset
      - name: Build runtime archive
        run: pnpm run runtime
      - name: Unit tests with coverage
        run: pnpm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The compiler itself, which is portable TypeScript -- so this is the half of the suite Windows
  # can reach, and the reason Windows is in the matrix at all. `lint` is NOT here: `.gitattributes`
  # checks out the same LF bytes everywhere, so the one run in `static` covers them. No coverage on
  # any of these (plain `pnpm run test`); linux/x64 (above) is the only coverage owner.
  # This job is the ungated Linux arm64 leg; the same steps run for macOS/Windows in stage 2 below.
  frontend:
    name: frontend (${{ matrix.platform }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: &frontend-steps
      - *checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        if: runner.os != 'Windows'
        with:
          just-version: '1.58.0'
      - *setup
      - *record-toolchain
      - *pnpm-install
      - run: pnpm run typecheck
      - run: pnpm run test:subset
      # A handful of unit tests compile and execute a native binary, so they need the archive the
      # Unix justfile builds. Windows has no such toolchain, so those tests skip THEMSELVES there
      # (`NATIVE_ONLY` in tests/unit/helpers.ts) and the rest of the file still runs -- which is
      # why unit tests below are unconditional and only this build step is gated.
      - name: Build runtime archive
        if: runner.os != 'Windows'
        run: pnpm run runtime
      - name: Unit tests
        run: pnpm run test

  # STAGE 2. macOS and Windows frontend legs: only after every stage-1 job passed.
  frontend-desktop:
    name: frontend (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [static, frontend-coverage]
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(vars.MACOS_CI_DISABLED == 'true' && '[{" platform": "windows", "arch": "x64", "os": "windows-2025 "}, {" platform": "windows", "arch": "arm64", "os": "windows-11-arm "}]' || '[{" platform": "macos", "arch": "arm64", "os": "macos-14 "}, {" platform": "windows", "arch": "x64", "os": "windows-2025 "}, {" platform": "windows", "arch": "arm64", "os": "windows-11-arm "}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *frontend-steps

  # The C runtime and everything that links it. Unix only: the runtime's just/clang toolchain is
  # not ported to Windows, and pretending otherwise with a red job helps nobody.
  # runtime / asan / intl / ffi each come as two jobs with the same steps: the Linux one (ungated)
  # and a `-macos` twin that is stage 2 (`needs: [static, frontend-coverage]`). Job ids differ,
  # check names do not.
  runtime:
    name: runtime (${{ matrix.platform }}/${{ matrix.arch }})
    strategy: &linux-strategy
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, os: ubuntu-24.04 }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
    needs: macos-runner
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    steps: &runtime-steps
      - *checkout
      - *setup-just
      - *setup
      # Without bdw-gc the justfile silently falls back to malloc and `test:leak` SKIPS -- a green
      # run that proved nothing about GC hygiene (plan.md Task 4.5). Installing it is what makes
      # the leak job's plateau assertion a real assertion.
      - &install-boehm
        name: Install Boehm GC
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libgc-dev clang llvm
          else
            brew install bdw-gc
          fi
      - name: Record toolchain
        shell: bash
        run: |
          clang --version
          uname -srm
      - *pnpm-install
      - run: pnpm run runtime
      - run: pnpm run test:runtime
      - run: pnpm run test:golden
      - run: pnpm run test:selfhost
      - run: pnpm run test:builtins
      - run: pnpm run test:leak

  runtime-macos:
    name: runtime (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [static, frontend-coverage, macos-runner]
    strategy: &macos-strategy
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: arm64, os: macos-14 }
    # Org variable MACOS_CI_DISABLED=true skips this macOS job.
    if: vars.MACOS_CI_DISABLED != 'true'
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    steps: *runtime-steps

  # Its own job rather than the tail of `runtime`: an ASan build is a second full compile of the
  # runtime AND of every golden fixture's generated C, so serializing it behind the ordinary
  # golden run doubles the platform's wall clock for no ordering reason.
  asan:
    name: asan (${{ matrix.platform }}/${{ matrix.arch }})
    strategy: *linux-strategy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: &asan-steps
      - *checkout
      - *setup-just
      - *setup
      - *install-boehm
      - *pnpm-install
      - run: pnpm run test:asan
        env:
          STATOR_ASAN_FORCE: '1'

  asan-macos:
    name: asan (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [static, frontend-coverage, macos-runner]
    strategy: *macos-strategy
    # Org variable MACOS_CI_DISABLED=true skips this macOS job.
    if: vars.MACOS_CI_DISABLED != 'true'
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    steps: *asan-steps

  # The ICU FEATURE build (plan.md Task 4.4), which the default archive must stay byte-identical
  # without -- so it is a separate build directory, a separate archive, and a separate job.
  intl:
    name: intl (${{ matrix.platform }}/${{ matrix.arch }})
    strategy: *linux-strategy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: &intl-steps
      - *checkout
      - *setup-just
      - *setup
      # icu4c is keg-only on Homebrew, so its .pc files are not on the default search path and
      # `just runtime-intl` would report ICU missing on a machine that has it.
      - name: Install ICU and Boehm GC
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libicu-dev libgc-dev clang llvm
          else
            brew install icu4c bdw-gc
            echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - *pnpm-install
      - run: pnpm run test:intl

  intl-macos:
    name: intl (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [static, frontend-coverage, macos-runner]
    strategy: *macos-strategy
    # Org variable MACOS_CI_DISABLED=true skips this macOS job.
    if: vars.MACOS_CI_DISABLED != 'true'
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    steps: *intl-steps

  # Its own job rather than the tail of `runtime`: FFI failures (link plumbing, boundary
  # checks, header determinism) have different owners from runtime failures, and serializing
  # them behind the golden/leak runs would hide which half broke. Unix only, like `runtime`:
  # the harness links against the just/clang-built archive.
  ffi:
    name: ffi (${{ matrix.platform }}/${{ matrix.arch }})
    strategy: *linux-strategy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: &ffi-steps
      - *checkout
      - *setup-just
      - *setup
      # SQLite ships in the macOS SDK; Linux needs the -dev package for sqlite3.h + libsqlite3.
      - name: Install Boehm GC and SQLite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libgc-dev libsqlite3-dev clang llvm
          else
            brew install bdw-gc
          fi
      - *pnpm-install
      - run: pnpm run runtime
      - run: pnpm run test:ffi
      # Task 7.2 step 9: the C-consumer example — a C main() calling an exported TS unit
      # through the emitted header (success + last_error paths, header double-build cmp).
      # `--emit-header`/`--unit-name` exist (cli/main.ts), so this builds, links, runs, and
      # byte-compares like the unit-level stub proof, as a CI step.
      - run: node packages/tests/ffi/example-c-consumer/c-consumer.ts
      # Task 7.4 Check: `--emit=lib` archives used through pkg-config alone from a directory
      # with no repo paths, byte-identical across two builds, and two libraries (two private
      # runtimes) in one C program over forced Boehm collections. The versions are the
      # evidence plan-notes 342 cites for each object format's localization.
      - name: Static library (--emit=lib)
        shell: bash
        run: |
          clang --version | head -n 1
          if [ "${{ runner.os }}" = "Linux" ]; then
            ld --version | head -n 1; objcopy --version | head -n 1; ar --version | head -n 1
          else
            ld -v 2>&1 | head -n 1
          fi
          node packages/tests/ffi/example-c-consumer/static-lib.ts
      # Task 7.3 Check: the SQLite demo's C main() against the emitted sqlitedemo header
      # (row-count success + nonzero-convention error paths, header double-build cmp).
      - run: node examples/ffi/sqlite/sqlite-c-main.ts

  ffi-macos:
    name: ffi (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [static, frontend-coverage, macos-runner]
    strategy: *macos-strategy
    # Org variable MACOS_CI_DISABLED=true skips this macOS job.
    if: vars.MACOS_CI_DISABLED != 'true'
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    steps: *ffi-steps

  revert-on-failure:
    name: revert-on-failure
    needs:
      - test262
      - test262-report
      - static
      - frontend-coverage
      - frontend
      - frontend-desktop
      - runtime
      - runtime-macos
      - asan
      - asan-macos
      - intl
      - intl-macos
      - ffi
      - ffi-macos
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Revert commits from this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No parent (new branch); skip revert"
            exit 0
          fi
          subject=$(git log -1 --format=%s "$AFTER")
          author=$(git log -1 --format=%an "$AFTER")
          case "$subject" in
            "ci: auto-revert"*) echo "Already an auto-revert; skip"; exit 0 ;;
          esac
          if [ "$author" = "github-actions[bot]" ]; then
            echo "Last commit is from actions bot; skip"
            exit 0
          fi
          # A revert of a push that touched .github/ would rewrite workflow files, which the
          # job's GITHUB_TOKEN cannot push without the `workflows` permission (and granting it
          # would let CI push workflow changes by itself). Leave those failures to a human.
          if git diff --name-only "$BEFORE" "$AFTER" -- .github/ | grep -q .; then
            echo "Push touched .github/; auto-revert needs 'workflows' permission — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent_count=$(git rev-list --parents -n 1 "$AFTER" | awk '{print NF}')
          if [ "$parent_count" -gt 2 ]; then
            git revert --no-edit -m 1 "$AFTER"
          else
            git revert --no-commit "$BEFORE".."$AFTER"
            if git diff --cached --quiet; then
              echo "Nothing to revert"
              exit 0
            fi
            short=$(git rev-parse --short "$AFTER")
            git commit -m "ci: auto-revert $short — main CI failed"
          fi
          git push origin HEAD:main
