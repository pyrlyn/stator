# Gated pipeline: pyrlyn-archive/ci-old's config-driven ci.yml (configured in .github/infra.yml) runs
# CodeQL, Semgrep, Snyk and SonarCloud behind `pipeline / gate`. TypeScript/C/Zig CI stays in ci.yml.
# Draft pull requests skip every job, the gate included, until marked ready. Secrets are passed
# explicitly.
# Shared workflows: https://github.com/pyrlyn-archive/ci-old/blob/main/docs/reusable-workflows.md
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    uses: pyrlyn-archive/ci-old/.github/workflows/ci.yml@9675ff42a0e3785beabccb68b0e4fa65910de453 # main 2026-10-27
    # The union every nested job asks for, validated up front even for disabled checks.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: write
      issues: write # pyrlyn-archive/ci-old main-failure job
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
