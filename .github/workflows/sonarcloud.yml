name: sonarcloud

# SonarCloud OSS analysis: pull requests to main (drafts skipped), pushes to main, and manual
# runs. Soft-fail for now: the coverage and scan steps use continue-on-error, and every step
# soft-skips when the SONAR_TOKEN secret is empty (fork pull requests, or before the secret is
# added). Setup and how to make it blocking: docs/sonarcloud-setup.md
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Empty on fork pull requests and until the repository secret is added.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  sonarcloud:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Skip SonarCloud (no token)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN is not set; skipping SonarCloud analysis."
          echo "Expected for fork pull requests and before the secret is added."
          echo "See docs/sonarcloud-setup.md."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Full history: Sonar uses blame data for new-code detection.
          fetch-depth: 0

      # Mirrors ./.github/actions/setup (pnpm, Node from .node-version, Zig) plus just, as the
      # ci.yml frontend job uses; the runtime archive is needed by the native-only unit tests.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.SONAR_TOKEN != ''

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SONAR_TOKEN != ''
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: env.SONAR_TOKEN != ''
        with:
          version: 0.16.0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: env.SONAR_TOKEN != ''
        with:
          just-version: '1.58.0'

      - name: Install dependencies
        if: env.SONAR_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Build runtime archive
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: pnpm run runtime

      # Same script as the ci.yml coverage owner (linux/x64): writes coverage/lcov.info.
      - name: Unit tests with coverage (LCOV)
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: pnpm run test:coverage

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
