name: site

# Build on PRs that touch the site; only main deploys.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # "true" only when this repository has a Pages site. Empty on pull requests,
      # where deploy does not run. A missing site skips deploy; the build still runs.
      pages: ${{ steps.pages_site.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the Node pin from mise.toml
        id: node_pin
        run: |
          version=$(grep '^node = ' mise.toml | cut -d '"' -f2)
          [ -n "$version" ] || { echo "no node pin found in mise.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node_pin.outputs.version }}

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version

      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile

      # configure-pages fails the job with "Get Pages site failed" when Pages is not
      # enabled (HTTP 404). That is a repository setting, not a broken site. Ask first
      # and skip publish; keep the build and the browser check either way. The check
      # runs on pull requests too, so a missing site is visible before a main push.
      - name: Check whether GitHub Pages is enabled
        id: pages_site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-site.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          case "$code" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages is not enabled for ${{ github.repository }}. The site is built and checked; deploy is skipped. Enable it under Settings → Pages → GitHub Actions to publish."
              ;;
            *)
              echo "GitHub Pages lookup returned HTTP ${code}" >&2
              cat /tmp/pages-site.json >&2
              exit 1
              ;;
          esac

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && steps.pages_site.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build
        working-directory: site
        run: pnpm build

      - name: Check the build produced what it should
        run: |
          cd site/dist
          for required in index.html favicon.svg logo.svg logo-wordmark.svg; do
            [ -s "$required" ] || { echo "missing or empty: $required" >&2; exit 1; }
          done
          grep -q 'TS/JS' index.html
          echo "site ok: $(find . -name '*.html' | wc -l) pages"

      # Same-origin requests only, no CSP violation, no sideways scroll at 320/360 px, a theme
      # toggle that cycles with storage blocked (plan.md Task 6.26). The runner's Chrome.
      - name: Browser check
        working-directory: site
        run: pnpm run check:browser

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' && steps.pages_site.outputs.enabled == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.pages == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
